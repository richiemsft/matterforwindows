name: Native Windows

on:
    push:
        branches:
            - master
            - windows-port
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    python-controller:
        name: Windows Python controller ${{ matrix.architecture }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 120

        strategy:
            fail-fast: false
            matrix:
                include:
                    - architecture: x64
                      runner: windows-latest
                    - architecture: arm64
                      runner: windows-11-vs2026-arm

        steps:
            - name: Enable git long paths
              shell: pwsh
              run: git config --global core.longpaths true

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  submodules: recursive

            - name: Build Python controller wheels
              shell: pwsh
              run: |
                  $parameters = @{
                      Architecture = '${{ matrix.architecture }}'
                      OutputRoot = 'out\windows-python-${{ matrix.architecture }}'
                      InstallVirtualEnv = 'out\venv'
                      BuildTestApp = $true
                  }
                  if ('${{ matrix.architecture }}' -eq 'arm64') {
                      $env:OPENSSL_DIR = Join-Path $env:ProgramFiles 'OpenSSL'
                      if (-not (Test-Path $env:OPENSSL_DIR -PathType Container)) {
                          throw "ARM64 OpenSSL installation was not found at $env:OPENSSL_DIR"
                      }
                      $opensslLibrary = Get-ChildItem -LiteralPath $env:OPENSSL_DIR -Recurse -Filter 'libcrypto.lib' -File |
                          Where-Object { Test-Path (Join-Path $_.DirectoryName 'libssl.lib') } |
                          Sort-Object @{ Expression = { $_.DirectoryName -notmatch '\\VC\\arm64\\MD$' } }, FullName |
                          Select-Object -First 1
                      if (-not $opensslLibrary) {
                          throw "ARM64 OpenSSL import libraries were not found below $env:OPENSSL_DIR"
                      }
                      $env:OPENSSL_LIB_DIR = $opensslLibrary.DirectoryName
                      $env:OPENSSL_STATIC = '0'
                  }
                  .\scripts\tools\windows_python_controller.ps1 @parameters
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  if ('${{ matrix.architecture }}' -eq 'arm64') {
                      $sitePackages = & 'out\venv\Scripts\python.exe' -c 'import sysconfig; print(sysconfig.get_path("purelib"))'
                      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                      $cryptographyBindings = Join-Path $sitePackages 'cryptography\hazmat\bindings'
                      $opensslRuntimeLibraries = @(
                          Get-ChildItem -LiteralPath (Join-Path $env:OPENSSL_DIR 'bin') -Filter '*.dll' -File |
                              Where-Object { $_.Name -match '^lib(crypto|ssl).+\.dll$' }
                      )
                      if ($opensslRuntimeLibraries.Count -lt 2) {
                          throw "ARM64 OpenSSL runtime libraries were not found below $env:OPENSSL_DIR"
                      }
                      Copy-Item -LiteralPath $opensslRuntimeLibraries.FullName -Destination $cryptographyBindings
                      & 'out\venv\Scripts\python.exe' -c 'from cryptography.hazmat.primitives import hashes'
                      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }

                  $dll = 'out\windows-python-${{ matrix.architecture }}\obj\src\controller\python\_ChipDeviceCtrl.dll'
                  $headers = dumpbin /headers $dll
                  $expectedMachine = if ('${{ matrix.architecture }}' -eq 'arm64') {
                      'AA64 machine \(ARM64\)'
                  } else {
                      '8664 machine \(x64\)'
                  }
                  if (-not ($headers | Select-String $expectedMachine)) {
                      throw "_ChipDeviceCtrl.dll has the wrong machine type"
                  }
                  $exportedBindings = dumpbin /exports $dll |
                      Select-String '\s(pychip_[A-Za-z0-9_]+)$' |
                      ForEach-Object { $_.Matches[0].Groups[1].Value } |
                      Sort-Object -Unique
                  foreach ($requiredExport in @(
                      'pychip_CommonStackInit',
                      'pychip_FormatError',
                      'pychip_DeviceController_StackInit',
                      'pychip_DeviceController_ConnectBLE',
                      'pychip_DeviceController_CommissionViaProxy',
                      'pychip_ReadClient_Read'
                  )) {
                      if ($requiredExport -notin $exportedBindings) {
                          throw "_ChipDeviceCtrl.dll omitted export: $requiredExport"
                      }
                  }

                  $objectDirectory = 'out\windows-python-${{ matrix.architecture }}\obj\src\controller\python'
                  $definedBindings = Get-ChildItem -LiteralPath $objectDirectory -Recurse -Filter '*.obj' -File |
                      ForEach-Object {
                          dumpbin /nologo /symbols $_.FullName |
                              Select-String 'SECT[0-9A-F]+\s+notype \(\)\s+External\s+\|\s+(pychip_[A-Za-z0-9_]+)$' |
                              ForEach-Object { $_.Matches[0].Groups[1].Value }
                      } |
                      Sort-Object -Unique
                  $missingExports = @($definedBindings | Where-Object { $_ -notin $exportedBindings })
                  if ($missingExports.Count -ne 0) {
                      throw "_ChipDeviceCtrl.dll omitted native bindings: $($missingExports -join ', ')"
                  }

            - name: Run native Python integration
              shell: pwsh
              run: |
                  $python = 'out\venv\Scripts\python.exe'
                  & $python -m unittest -v src.python_testing.test_testing.TestWindowsHarnessPortability
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

                  & $python .\scripts\tests\run_python_test.py `
                      --factory-reset `
                      --app .\out\windows-python-${{ matrix.architecture }}\all-devices-app.exe `
                      --app-ready-pattern 'APP STATUS: Starting event loop' `
                      --app-args '--device temperature-sensor:1 --discriminator 1234 --KVS out/windows-python-${{ matrix.architecture }}/test-kvs' `
                      --script .\src\python_testing\TC_TMP_2_1.py `
                      --script-args '--storage-path out/windows-python-${{ matrix.architecture }}/admin-storage.json --commissioning-method on-network-ip --ip-addr 127.0.0.1 --discriminator 1234 --passcode 20202021 --endpoint 1'
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

                  & $python .\scripts\tests\local.py python-tests `
                      --test-filter TC_BOOL_2_2,TC_DeviceBasicComposition,TC_DeviceConformance,TC_G_2_2,TC_IDM_2_3,TC_OCC_3_1,TC_OCC_3_2,TC_SC_5_1 `
                      --app-filter ALL_DEVICES_APP `
                      --override-binary-path ALL_DEVICES_APP out\windows-python-${{ matrix.architecture }}\all-devices-app.exe `
                      --commissionee-ip 127.0.0.1 `
                      --keep-going `
                      --fail-log-dir out\windows-suite-failures-${{ matrix.architecture }}
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Upload simulator suite failures
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: windows-simulator-suite-failures-${{ matrix.architecture }}
                  path: out/windows-suite-failures-${{ matrix.architecture }}
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Upload Python wheels
              if: success()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: matter-python-windows-${{ matrix.architecture }}
                  path: out/windows-python-${{ matrix.architecture }}/python-wheels/*.whl
                  if-no-files-found: error
                  retention-days: 7

    build:
        name: Windows ${{ matrix.architecture }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 120

        strategy:
            fail-fast: false
            matrix:
                include:
                    - architecture: x64
                      target_cpu: x64
                      runner: windows-latest
                    - architecture: arm64
                      target_cpu: arm64
                      runner: windows-11-vs2026-arm

        steps:
            - name: Enable git long paths
              shell: pwsh
              run: git config --global core.longpaths true

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  submodules: recursive

            - name: Build native Windows targets
              shell: pwsh
              run: |
                  . .\scripts\setup\windows.ps1 -Architecture ${{ matrix.architecture }}

                  $output = "out\win-ci-${{ matrix.architecture }}"
                  $arguments = @(
                      'target_os="win"'
                      'target_cpu="${{ matrix.target_cpu }}"'
                      'chip_device_platform="windows"'
                      'chip_windows_canonical_compile_probes=true'
                      'chip_windows_device_layer_probe=true'
                      'chip_windows_build_chip_tool=true'
                      'chip_windows_build_all_devices_app=true'
                      'chip_config_enable_groupcast=true'
                      'chip_windows_enable_cxx20=true'
                      'chip_with_nlfaultinjection=false'
                      'chip_build_tests=false'
                      'chip_build_tools=true'
                      'chip_caller_handles_critical_failure=true'
                      'is_debug=false'
                  ) -join ' '

                  gn gen $output --args=$arguments
                  if ($LASTEXITCODE -ne 0) {
                      exit $LASTEXITCODE
                  }

                  ninja -C $output `
                      all-devices-app `
                      chip-tool `
                      msvc-canonical-controller-stack-smoke `
                      msvc-canonical-platform-smoke `
                      msvc-core-unit-tests `
                      msvc-crypto-boringssl-tests `
                      msvc-crypto-pal-tests `
                      msvc-crypto-upstream-tests `
                      msvc-inet-endpoint-tests `
                      msvc-inet-upstream-tests `
                      msvc-key-value-store-smoke `
                      msvc-secure-channel-status-report-tests `
                      msvc-secure-channel-tests `
                      msvc-system-upstream-tests `
                      msvc-transport-crypto-context-tests `
                      msvc-transport-tests `
                      msvc-windows-all-clusters `
                      msvc-windows-ble-smoke `
                      msvc-windows-configuration-manager-smoke
                  if ($LASTEXITCODE -ne 0) {
                      exit $LASTEXITCODE
                  }

                  if ('${{ matrix.architecture }}' -eq 'arm64') {
                      $headers = dumpbin /headers "$output\all-devices-app.exe"
                      if (-not ($headers | Select-String 'AA64 machine \(ARM64\)')) {
                          throw 'all-devices-app.exe is not an ARM64 binary'
                      }
                  }

            - name: Run native test coverage
              shell: pwsh
              run: |
                  $output = "out\win-ci-${{ matrix.architecture }}"
                  foreach ($test in @(
                      'msvc-core-unit-tests',
                      'msvc-crypto-boringssl-tests',
                      'msvc-crypto-pal-tests',
                      'msvc-crypto-upstream-tests',
                      'msvc-inet-endpoint-tests',
                      'msvc-inet-upstream-tests',
                      'msvc-secure-channel-status-report-tests',
                      'msvc-secure-channel-tests',
                      'msvc-system-upstream-tests',
                      'msvc-transport-crypto-context-tests',
                      'msvc-transport-tests'
                  )) {
                      & "$output\$test.exe" --gtest_brief=1
                      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }
                  & "$output\msvc-key-value-store-smoke.exe"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  & "$output\msvc-canonical-platform-smoke.exe"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  & "$output\msvc-canonical-controller-stack-smoke.exe"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  & "$output\msvc-windows-configuration-manager-smoke.exe"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  & "$output\msvc-windows-ble-smoke.exe"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  & "$output\msvc-windows-all-clusters.exe" 1
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  & "$output\all-devices-app.exe" `
                      --device on-off-light:1 `
                      --device occupancy-sensor:2 `
                      --discriminator 1234 `
                      --KVS "$output\all-devices-state" `
                      --interface-id -1 `
                      --run-seconds 1 2>&1 |
                      Tee-Object -Variable allDevicesLog
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $allDevicesText = $allDevicesLog | Out-String
                  foreach ($requiredOutput in @(
                      'discriminator=1234/04',
                      'SetupQRCode: [MT:',
                      'APP STATUS: Starting event loop'
                  )) {
                      if (-not $allDevicesText.Contains($requiredOutput)) {
                          throw "all-devices-app omitted automation marker: $requiredOutput"
                      }
                  }

            - name: Package applications
              if: success()
              shell: pwsh
              run: |
                  .\scripts\tools\windows_package.ps1 `
                      -OutDir "out\win-ci-${{ matrix.architecture }}" `
                      -Architecture ${{ matrix.architecture }} `
                      -DestinationDirectory artifacts
                  .\scripts\tools\windows_package_verify.ps1 `
                      -ArchivePath "artifacts\matter-windows-${{ matrix.architecture }}.zip" `
                      -Architecture ${{ matrix.architecture }}

            - name: Upload application package
              if: success()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: matter-windows-${{ matrix.architecture }}
                  path: artifacts/matter-windows-${{ matrix.architecture }}.zip
                  if-no-files-found: error
                  retention-days: 7
